<section class="purpose-section">

    <div class="container">

        <h2 class="text-center">

            What kind of space do you need today?

        </h2>

        <p class="text-center subtitle">

            Choose a category and discover the perfect space.

        </p>

        <div class="row mt-5">

            @for (purpose of purposes; track purpose.title) {

            <div class="col-lg-3 col-md-6 mb-4">

                <div class="purpose-card">

                    <div class="icon">

                        {{purpose.icon}}

                    </div>

                    <h4>

                        {{purpose.title}}

                    </h4>

                    <p>

                        {{purpose.description}}

                    </p>

                </div>

            </div>

            }

        </div>

    </div>

</section>
